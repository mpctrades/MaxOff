# The production hostname.
#
# Proxies to the same backend as dev.maxoff.mpctrades.com — one container, one
# database, two names — because the app's identity in Shopify is a single
# `application_url` and running a second copy would split sessions between two
# databases for no gain.
#
# `SHOPIFY_APP_URL` in the container must match whichever name Shopify is
# configured with, because React Router bakes the allowed action origin into
# the server build and App Bridge posts from that origin. When this host
# becomes the app's URL, the container is rebuilt with it; dev.* keeps serving
# so old links do not 404, but the embedded app redirects to this name.
#
# TLS is Let's Encrypt via certbot --nginx. Cloudflare is DNS-only (grey
# cloud) for this record, matching dev.*, so HTTP-01 validation reaches the
# origin.

server {
    listen 80;
    listen [::]:80;
    server_name app.maxoff.mpctrades.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.maxoff.mpctrades.com;

    ssl_certificate /etc/letsencrypt/live/app.maxoff.mpctrades.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.maxoff.mpctrades.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

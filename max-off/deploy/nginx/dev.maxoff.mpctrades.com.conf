# Deployed to /etc/nginx/sites-available/dev.maxoff.mpctrades.com.
#
# The only thing a deploy changes is the included upstream file, which holds a
# single `server 127.0.0.1:<port>;` line naming the live colour. Everything
# else here is stable, so a deploy never rewrites this file and never risks the
# twelve other sites on this box.

upstream maxoff_dev_app {
    # Written by deploy/deploy.sh, then `nginx -t` and a graceful reload.
    # Deliberately one server, not two: with both colours listed, nginx would
    # round-robin across them during the overlap and a browser that loaded its
    # HTML from the old build could ask the new one for a hashed asset that
    # only exists in the old. One server at a time means a client always talks
    # to a single consistent build.
    include /etc/nginx/maxoff/dev-active-upstream.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.maxoff.mpctrades.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.maxoff.mpctrades.com;

    ssl_certificate /etc/letsencrypt/live/dev.maxoff.mpctrades.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.maxoff.mpctrades.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://maxoff_dev_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

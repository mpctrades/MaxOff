# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2054aaf833b91f2a63cd47e8663c88ac"
application_url = "https://maxoff-dev.mpctrades.com"
embedded = true
name = "MaxOff"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Every scope MaxOff needs, and nothing else (BUILD-SPEC §3.3):
#
#   write_discounts  create, update, pause and delete capped discounts, and
#                    declare the discount metafield below.
#   read_discounts   required, not optional: `discountCodeAppCreate` selecting
#                    `codeAppDiscount { discountId }` — the id we must mirror —
#                    reports "Required scopes: write_discounts,
#                    read_discounts", and so does the code uniqueness check.
#                    §3.3 said write_discounts covered our reads; validation on
#                    10 Sep 2026 showed it does not.
#   read_products    the cart tester's resource picker, so a merchant tests the
#                    cap against their own catalogue.
#
# The template's write_products, write_metaobjects and write_metaobject_definitions
# went with the demo action they existed for. read_orders comes with the
# money-kept analytics and needs protected-customer-data approval first.
scopes = "write_discounts,read_discounts,read_products"

[discount.metafields.app.cap_config]
type = "json"
name = "MaxOff cap configuration"
description = "The percentage, the maximum discount and the code, read by the MaxOff Function at checkout"

  [discount.metafields.app.cap_config.access]
  # Merchants can see the cap on the discount but only MaxOff writes it, so the
  # app's own mirror can never drift from what the Function reads.
  admin = "merchant_read"
  storefront = "none"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory privacy topics for every public App Store app. All three use one
  # authenticated endpoint; `authenticate.webhook` verifies Shopify's HMAC
  # before the handler reads the topic or changes any stored data.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://maxoff-dev.mpctrades.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

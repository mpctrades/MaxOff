# `$collectionIds` is not a runtime argument in the usual sense: Shopify reads
# it from the discount's own `cap_config` metafield, by key name, because
# `[extensions.input.variables]` in shopify.extension.toml points at that
# namespace and key. A Function cannot ask what is in a collection, so this is
# the only way merchant-chosen collections can reach it.
#
# It is declared `[ID!]` and not `[ID!]!`: a discount that targets all products
# has no collectionIds, the variable arrives null, and a required variable
# would abort the whole function run instead. Both collection fields below
# declare a default of `[]` on their argument, which is what makes a nullable
# variable legal in a non-null position.
#
# Two collection fields, because they answer two different questions:
#
#   inAnyCollection  — is this line in the targeted set at all? Decides
#                      eligibility, and is all the `order` and `item` scopes need.
#   inCollections    — *which* of the targeted collections is it in? Only the
#                      `collection` scope needs this, and only it can group
#                      lines into one maximum per collection.
#
# `inCollections` is asked for unconditionally rather than in a second query:
# a Function's input query is fixed at deploy time and cannot branch on the
# metafield it is about to read.
query CartInput($collectionIds: [ID!]) {
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            inAnyCollection(ids: $collectionIds)
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "cap_config") {
      jsonValue
    }
  }
}

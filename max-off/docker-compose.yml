services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxoff
      POSTGRES_USER: maxoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxoff -d maxoff"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - maxoff_postgres:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: .
      args:
        SHOPIFY_APP_URL: ${SHOPIFY_APP_URL}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maxoff:${POSTGRES_PASSWORD}@db:5432/maxoff?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - internal

networks:
  internal:

volumes:
  maxoff_postgres:
